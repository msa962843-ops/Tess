    <!-- Skrip Keamanan Tambahan & Aplikasi -->
    <script>
    // --- SKRIP KEAMANAN (PROTEKSI DEVTOOLS) ---
    (function SecurityShield() {
        document.addEventListener('keydown', function(event) {
            if (
                event.key === 'F12' ||
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) ||
                (event.ctrlKey && (event.key === 'U' || event.key === 'u' || event.key === 'S' || event.key === 's'))
            ) {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }
        }, true);

        setInterval(function() {
            const startTime = performance.now();
            (function() {}['constructor']('debugger')());
            const endTime = performance.now();
            if (endTime - startTime > 100) {
                document.body.innerHTML = '<div style="color:white;text-align:center;padding:50px;">Akses ditolak. Silakan tutup Developer Tools.</div>';
            }
        }, 1000);
    })();

    let globalSupa = null;
    try {
        if (typeof window !== 'undefined' && window.supabase) {
            globalSupa = window.supabase;
        } else if (typeof supabase !== 'undefined') {
            globalSupa = supabase;
        }
    } catch (error) {
        console.error("Error loading library");
    }

    let targetPath = window.location.pathname || '';
    const storedPath = sessionStorage.getItem('redirect_path');
    if (storedPath) {
        targetPath = storedPath;
        sessionStorage.removeItem('redirect_path');
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, null, targetPath);
        }
    }

    let videoSlug = '';
    const pathSegments = targetPath.split('/').filter(Boolean);
    if (pathSegments.length > 0) {
        let lastSeg = pathSegments[pathSegments.length - 1];
        if (lastSeg && lastSeg !== 'index.html' && lastSeg !== '404.html') {
            videoSlug = lastSeg;
        } else if (pathSegments.length > 1) {
            videoSlug = pathSegments[pathSegments.length - 2];
        }
    }

    if (!videoSlug && window.location.search) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('p')) {
            videoSlug = urlParams.get('p');
        } else if (urlParams.has('slug')) {
            videoSlug = urlParams.get('slug');
        } else if (urlParams.has('v')) {
            videoSlug = urlParams.get('v');
        }
    }

    if (videoSlug) {
        videoSlug = videoSlug.replace('.html', '');
    }

    const SUPABASE_URL = 'https://ehhrvswzhirrnrqxmxae.supabase.co',
          SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoaHJ2c3d6aGlycm5ycXhteGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjg2NDcsImV4cCI6MjA5NTgwNDY0N30.75vZs3Rn6j7YSlInHpGDN39OGjhywcEBv8j-hawyOlY',
          supabaseClient = globalSupa && typeof globalSupa.createClient === 'function' ? globalSupa.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const folderTitleDisplay = document.getElementById('folder-title-display'),
          navHeaderTitle = document.getElementById('nav-header-title'),
          folderDate = document.getElementById('folder-date'),
          filesFeedContainer = document.getElementById('files-feed-container'),
          fileCountSpan = document.getElementById('file-count');

    let videoUrlsCache = {};

    function renderEmptyFolderState(message) {
        if (!filesFeedContainer) return;
        filesFeedContainer.innerHTML = `
            <div class="w-full bg-[#161f36] border border-[#1e2a47] rounded-2xl p-8 flex flex-col justify-center items-center text-center">
                <div class="w-12 h-12 rounded-xl bg-[#1e2a47] flex items-center justify-center text-[#3b82f6] text-xl mb-2">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h2 class="text-xs font-semibold text-white">This folder is empty</h2>
                <p class="text-[11px] text-[#8c97b2] max-w-xs mt-1">${message || 'Upload files or create a subfolder to get started.'}</p>
            </div>
        `;
    }

    async function loadGofileFeed() {
        if (!folderTitleDisplay || !filesFeedContainer) return;

        if (!supabaseClient) {
            folderTitleDisplay.textContent = 'root';
            renderEmptyFolderState('Gagal terhubung ke koneksi server.');
            return;
        }

        if (!videoSlug || videoSlug === 'view.html' || videoSlug === 'index.html' || videoSlug === '404.html') {
            folderTitleDisplay.textContent = 'root';
            renderEmptyFolderState('Gunakan URL dengan token slug yang valid.');
            return;
        }

        try {
            const { data: folderData, error: folderError } = await supabaseClient.from('video_packages').select('*').eq('slug', videoSlug).single();
            
            if (folderError || !folderData) {
                folderTitleDisplay.textContent = 'Folder Tidak Ditemukan';
                document.title = 'Folder Tidak Ditemukan · Gofile';
                renderEmptyFolderState(`Berkas tidak ditemukan.`);
                return;
            }
            
            const titleText = folderData.title || 'root';
            folderTitleDisplay.textContent = titleText;
            if (navHeaderTitle) navHeaderTitle.textContent = titleText;

            // --- OTOMATIS MEMPERBARUI JUDUL TAB BROWSER & META TAG ---
            const fullTitle = `${titleText} · Gofile`;
            document.title = fullTitle;

            const ogTitleMeta = document.querySelector('meta[property="og:title"]');
            if (ogTitleMeta) ogTitleMeta.setAttribute('content', fullTitle);

            const twitterTitleMeta = document.querySelector('meta[name="twitter:title"]');
            if (twitterTitleMeta) twitterTitleMeta.setAttribute('content', fullTitle);

            if (folderData.created_at) {
                const dateObj = new Date(folderData.created_at);
                folderDate.innerHTML = `<i class="fa-regular fa-calendar mr-1"></i> ${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}, ${dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
            }
            
            const { data: fileItems, error: itemsError } = await supabaseClient.from('video_items').select('*').eq('package_id', folderData.id);
            
            if (itemsError || !fileItems || fileItems.length === 0) {
                if (fileCountSpan) fileCountSpan.innerHTML = '<i class="fa-regular fa-file mr-1"></i> 0 items';
                renderEmptyFolderState();
                return;
            }
            
            const totalItems = fileItems.length;
            if (fileCountSpan) fileCountSpan.innerHTML = `<i class="fa-regular fa-file mr-1"></i> ${totalItems} items`;

            const countDesc = `${totalItems} files shared with Gofile`;
            const ogDescMeta = document.querySelector('meta[property="og:description"]');
            if (ogDescMeta) ogDescMeta.setAttribute('content', countDesc);

            filesFeedContainer.innerHTML = '';

            fileItems.forEach((item, index) => {
                const originalUrl = item.video_url;
                videoUrlsCache[item.id] = originalUrl;
                
                let cleanerPath = originalUrl.split('#')[0],
                    fileName = cleanerPath.split('/').pop().split('?')[0] || (folderData.title || 'file') + '-' + (index + 1) + '.jpg';
                    
                if (originalUrl.includes('youtube.com') || originalUrl.includes('youtu.be')) {
                    fileName = (folderData.title || 'stream') + '-' + (index + 1) + '.mp4';
                }
                
                const randomSize = ((index + 1) * 46.1).toFixed(1) + ' KB';
                      
                let displayDate = 'Sep 21, 2026, 11:00 AM';
                if (item.created_at) {
                    const itemDate = new Date(item.created_at);
                    displayDate = itemDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + itemDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                }
                
                const fileCard = document.createElement('div');
                fileCard.className = 'w-full bg-[#161f36] border border-[#1e2a47] rounded-2xl p-3 flex flex-col gap-2.5 shadow-md transition-all duration-300';
                fileCard.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2.5 flex-1 min-w-0">
                            <input type="checkbox" class="w-4 h-4 rounded border-[#2b3b61] bg-[#0b101b] text-blue-600 focus:ring-0 cursor-pointer accent-blue-600">
                            <div class="text-[#8b5cf6] text-lg flex-shrink-0">
                                <i class="fa-solid fa-file-image"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-xs font-bold text-white tracking-wide break-all line-clamp-1">${fileName}</h3>
                                <div class="flex items-center gap-2 text-[11px] text-[#8c97b2] mt-0.5">
                                    <span><i class="fa-regular fa-calendar mr-1"></i>${displayDate}</span>
                                    <span>${randomSize}</span>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="w-7 h-7 rounded-lg hover:bg-[#1e2a47] text-[#8c97b2] hover:text-white flex items-center justify-center text-xs transition-all flex-shrink-0">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>
                    </div>

                    <div class="w-full flex justify-center items-center mt-1">
                        <div id="mini-viewport-${item.id}" onclick="handleThumbnailClick(event, '${item.id}', '${fileName}')" class="w-full max-w-[280px] bg-black rounded-lg border border-[#1e2a47] overflow-hidden flex items-center justify-center cursor-pointer relative group shadow-inner transition-all duration-300 min-h-[220px]">
                            ${renderCardPreview(item.id, originalUrl)}
                            <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 flex items-center justify-center transition-all">
                                <div class="w-10 h-10 rounded-full bg-blue-600/90 text-white flex items-center justify-center text-sm shadow-lg group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-play ml-0.5"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="expanded-zone-${item.id}" class="w-full hidden mt-1 bg-black border border-[#1e2a47] shadow-2xl rounded-xl overflow-hidden transition-all duration-300"></div>
                `;
                
                filesFeedContainer.appendChild(fileCard);
            });
        } catch (err) {
            folderTitleDisplay.textContent = 'root';
            renderEmptyFolderState('Terjadi kendala jaringan.');
        }
    }

    function renderCardPreview(id, url) {
        if (url.match(/\.(mp4|webm|ogg)/i) || url.includes('supabase.co/storage')) {
            const timedUrl = url.includes('#t=') ? url : url + '#t=5';
            return `<video preload="metadata" muted playsinline oncontextmenu="return false;" class="w-full h-auto max-h-[340px] object-contain pointer-events-none select-none"><source src="${timedUrl}" type="video/mp4"></video>`;
        } else {
            return `<img src="${url}" oncontextmenu="return false;" class="w-full h-auto max-h-[340px] object-contain pointer-events-none select-none" onerror="this.onerror=null; this.src='https://gofile.io/assets/img/logo-small-og.png';" />`;
        }
    }

    function handleThumbnailClick(event, id, name) {
        event.preventDefault();
        event.stopPropagation();
        playVideo(id, name);
    }

    function playVideo(id, name) {
        const viewport = document.getElementById('mini-viewport-' + id),
              zone = document.getElementById('expanded-zone-' + id),
              sourceUrl = videoUrlsCache[id];
              
        if (!viewport || !zone || !sourceUrl) return;
        
        viewport.parentElement.style.display = 'none';
        zone.classList.remove('hidden');
        
        if (sourceUrl.match(/\.(mp4|webm|ogg)/i) || sourceUrl.includes('supabase.co/storage')) {
            const cleanUrl = sourceUrl.split('#')[0];
            zone.innerHTML = `
                <div class="relative w-full flex flex-col bg-black">
                    <button type="button" onclick="closeVideo('${id}')" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-black/70 hover:bg-red-600 text-white flex items-center justify-center text-xs shadow-md">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <video id="active-video-${id}" controls playsinline autoplay controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false;" class="w-full h-auto max-h-[80vh] bg-black select-none object-contain">
                        <source src="${cleanUrl}" type="video/mp4">
                    </video>
                </div>
            `;

            const videoElem = document.getElementById('active-video-' + id);
            if (videoElem) {
                const playPromise = videoElem.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function() {
                        videoElem.muted = true;
                        videoElem.play();
                    });
                }
            }
        } else if (sourceUrl.includes('youtube.com') || sourceUrl.includes('youtu.be')) {
            zone.classList.add('aspect-video');
            let finalEmbed = sourceUrl;
            if (finalEmbed.includes('watch?v=')) finalEmbed = finalEmbed.replace('watch?v=', 'embed/');
            if (finalEmbed.includes('youtu.be/')) finalEmbed = finalEmbed.replace('youtu.be/', 'youtube.com/embed/');
            
            finalEmbed += finalEmbed.includes('?') ? '&autoplay=1' : '?autoplay=1';
            zone.innerHTML = `
                <div class="relative w-full h-full">
                    <button type="button" onclick="closeVideo('${id}')" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-black/70 hover:bg-red-600 text-white flex items-center justify-center text-xs shadow-md">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <iframe src="${finalEmbed}" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            `;
        } else {
            zone.innerHTML = `
                <div class="relative w-full flex flex-col bg-black">
                    <button type="button" onclick="closeVideo('${id}')" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-black/70 hover:bg-red-600 text-white flex items-center justify-center text-xs shadow-md">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <img src="${sourceUrl}" oncontextmenu="return false;" class="w-full h-auto max-h-[80vh] object-contain select-none" />
                </div>
            `;
        }
        
        setTimeout(function() {
            zone.scrollIntoView({ 'behavior': 'smooth', 'block': 'center' });
        }, 150);
    }

    function closeVideo(id) {
        const viewport = document.getElementById('mini-viewport-' + id),
              zone = document.getElementById('expanded-zone-' + id);
              
        if (!viewport || !zone) return;
        
        zone.innerHTML = '';
        zone.classList.add('hidden');
        zone.classList.remove('aspect-video');
        viewport.parentElement.style.display = 'flex';
    }

    loadGofileFeed();
    </script>
